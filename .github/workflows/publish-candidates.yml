name: Publish Candidates
on:
  workflow_call:
    secrets:
      OCI_REGISTRY_USERNAME:
        required: false
      OCI_REGISTRY_PASSWORD:
        required: false

env:
  OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'openchoreo/openchoreo-ui' }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.OCI_REGISTRY_HOST }}
          username: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_USERNAME || github.actor) || secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_PASSWORD || github.token) || secrets.OCI_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Set image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          echo "GIT_SHA_SHORT=$SHA" >> "$GITHUB_OUTPUT"
          TAGS="$OCI_REGISTRY_HOST/$IMAGE_NAME:$SHA"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="$TAGS,$OCI_REGISTRY_HOST/$IMAGE_NAME:latest-dev"
          fi
          echo "TAGS=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: check-image
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          if docker buildx imagetools inspect "$OCI_REGISTRY_HOST/$IMAGE_NAME:${SHA}" >/dev/null 2>&1; then
            echo "Image $OCI_REGISTRY_HOST/$IMAGE_NAME:${SHA} already exists. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image not found. Proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push commit image
        if: steps.check-image.outputs.skip != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          push: true
          file: ./packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tag.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
