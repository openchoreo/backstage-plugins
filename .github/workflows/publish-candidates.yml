name: Publish Candidates
on:
  workflow_call:
    secrets:
      OCI_REGISTRY_USERNAME:
        required: false
      OCI_REGISTRY_PASSWORD:
        required: false

env:
  OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'openchoreo/openchoreo-ui' }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.OCI_REGISTRY_HOST }}
          username: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_USERNAME || github.actor) || secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_PASSWORD || github.token) || secrets.OCI_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Set image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          echo "TAG=$OCI_REGISTRY_HOST/$IMAGE_NAME:${SHA}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Check if arch image already exists
        id: check-image
        run: |
          if docker buildx imagetools inspect "${{ steps.tag.outputs.TAG }}" >/dev/null 2>&1; then
            echo "Image ${{ steps.tag.outputs.TAG }} already exists. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image not found. Proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.arch }} image
        if: steps.check-image.outputs.skip != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          push: true
          file: ./packages/backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tag.outputs.TAG }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Login to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.OCI_REGISTRY_HOST }}
          username: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_USERNAME || github.actor) || secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ env.OCI_REGISTRY_HOST == 'ghcr.io' && (secrets.OCI_REGISTRY_PASSWORD || github.token) || secrets.OCI_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Determine ref context
        id: ref
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if manifest already exists
        id: check-manifest
        run: |
          # Only safe to skip off-main: on main this step also refreshes the
          # latest-dev floating tag, which must always run even if $SHA was
          # already published (e.g. promoted from a release branch).
          if [[ "${{ steps.ref.outputs.on-main }}" != "true" ]]; then
            SHA="${GITHUB_SHA:0:8}"
            if docker buildx imagetools inspect "$OCI_REGISTRY_HOST/$IMAGE_NAME:${SHA}" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        if: steps.check-manifest.outputs.skip != 'true'
        run: |
          SHA="${GITHUB_SHA:0:8}"
          IMAGE="$OCI_REGISTRY_HOST/$IMAGE_NAME"
          TAGS=("${IMAGE}:${SHA}")
          if [[ "${{ steps.ref.outputs.on-main }}" == "true" ]]; then
            TAGS+=("${IMAGE}:latest-dev")
          fi
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(--tag "$t"); done
          docker buildx imagetools create "${ARGS[@]}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
