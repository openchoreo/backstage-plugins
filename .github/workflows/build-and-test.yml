name: Build and Test
on:
  push:
    branches:
      - main
      - 'release-v*'
  pull_request:
    branches:
      - main
      - 'release-v*'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'openchoreo/openchoreo-ui' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:all

      - name: Check formatting
        run: yarn prettier --check .

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Security audit
        run: yarn npm audit --environment production --severity high

  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        # --silent suppresses noisy console.* output (jsdom/@backstage/ui CSS
        # warnings) so failures stand out; assertion diffs still print.
        run: yarn test:all --silent

      - name: Upload coverage to Codecov
        if: vars.CODECOV_ENABLED != 'false'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

      - name: Coverage summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f coverage/lcov.info ] && [ -s coverage/lcov.info ]; then
            LINES_FOUND=$(awk '/^DA:/{n++} END{print n+0}' coverage/lcov.info)
            LINES_HIT=$(awk -F, '/^DA:/{if($2+0>0)n++} END{print n+0}' coverage/lcov.info)
            if [ "$LINES_FOUND" -gt 0 ]; then
              COVERAGE=$(( LINES_HIT * 100 / LINES_FOUND ))
              echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Lines found | $LINES_FOUND |" >> $GITHUB_STEP_SUMMARY
              echo "| Lines hit | $LINES_HIT |" >> $GITHUB_STEP_SUMMARY
              echo "| **Line coverage** | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No coverage data found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check generated types freshness
        run: |
          yarn workspace @openchoreo/openchoreo-client-node generate:clients
          if ! git diff --quiet --exit-code packages/openchoreo-client-node/src/generated/ packages/openchoreo-client-node/src/version.ts; then
            echo "::error::Generated types are stale. Run 'yarn workspace @openchoreo/openchoreo-client-node generate:clients' and commit the changes."
            git diff --stat packages/openchoreo-client-node/src/generated/ packages/openchoreo-client-node/src/version.ts
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript compile
        run: yarn tsc

      - name: Build
        run: yarn build:all

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [lint, audit, test, build]
    permissions:
      packages: write
    uses: ./.github/workflows/publish-candidates.yml
    secrets:
      OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
      OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
