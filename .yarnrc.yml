# NOTE: `yarn set version` rewrites this file and will re-add
# `approvedGitRepositories: ['**']` to preserve legacy behaviour. Do not keep
# it — this repo has no git-protocol dependencies, so Yarn 4's default of
# rejecting them should stand.

# Required: ~15 transitive dependencies ship native addons that must compile
# (better-sqlite3, esbuild, isolated-vm, keytar, tree-sitter, ssh2, ...). Yarn
# 4.18 flipped this default to false; without it the install succeeds but
# leaves those packages unbuilt and the build fails later. Set explicitly to
# preserve the behaviour this repo already had under Yarn 4.4.1.
enableScripts: true

nodeLinker: node-modules

# Delay installing freshly published versions, matching the guidance the
# install docs give adopters. @backstage/* is pre-approved because Backstage
# release trains routinely require same-day bumps.
npmMinimalAgeGate: 1d

npmPreapprovedPackages:
  - '@backstage/*'

# Publish to the canonical npm host. Yarn's default npmRegistryServer is
# registry.yarnpkg.com, a read-only mirror, and npm's trusted-publishing OIDC
# exchange is bound to registry.npmjs.org.
npmPublishRegistry: 'https://registry.npmjs.org'

yarnPath: .yarn/releases/yarn-4.18.0.cjs
